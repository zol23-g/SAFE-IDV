# SAFE IDV Demo -- Spring Boot port
# Port matches the Python version's default (mock_server.py's PORT = 8080).
server.port=8080

# Server-wide API key defaults -- same precedence as the Python version:
# these properties, then the api_keys.json file below, with a per-request
# key in the POST body (liveKeys) always taking priority over both. Leave
# blank to run in mock mode by default (recommended for anything other
# than one trusted local developer -- see ApiKeyService's class comment).
safe.openai-api-key=${OPENAI_API_KEY:}
safe.anthropic-api-key=${ANTHROPIC_API_KEY:}

# Local fallback key file, same idea as api_keys.json next to the Python
# version's mock_server.py.
safe.api-keys-file=${SAFE_API_KEYS_FILE:api_keys.json}

# Vision model names -- overridable the same way as the Python version's
# SAFE_DEMO_OPENAI_MODEL / SAFE_DEMO_CLAUDE_MODEL env vars (read directly
# in VisionProviderService via System.getenv(), not through Spring config,
# to keep that one-to-one with the Python original).

# v70: where saved session reports (static HTML, one per session, written by
# ReportController) live on disk. Deliberately a plain external folder next
# to wherever the jar is actually run from -- NOT under src/main/resources/
# static, because that folder gets bundled INTO the jar at build time and is
# read-only at runtime once packaged. Relative path is resolved against the
# JVM's working directory; set SAFE_REPORTS_DIR to an absolute path in any
# environment where that's not predictable (e.g. a systemd unit with a fixed
# WorkingDirectory=, or a container volume mount).
safe.reports-dir=${SAFE_REPORTS_DIR:reports}

# v70: independent, OPT-IN provider overrides for the two AI-driven
# services (OCR of the ID document, and Face Match against the selfie).
# By default -- everything below left blank -- both services keep running
# exactly as before: both openai/anthropic keys above run in FULL PARALLEL
# as vendor "pairs" (each pair doing its own OCR + Face Match), and the
# report's provider-comparison debug view keeps showing both side by side.
#
# Setting any of the four properties for a service points JUST that
# service somewhere else -- independently of the other service, and
# without needing the shared key above to be set at all:
#   provider   "openai" or "anthropic" -- which REQUEST SHAPE to use (the
#              two vendors' vision APIs are structured differently; a real
#              third-party vendor whose API mimics one of these two shapes,
#              e.g. many OpenAI-compatible gateways/proxies, can be pointed
#              at via that shape + base-url below without new code).
#   api-key    overrides the shared key above for this service only.
#   base-url   overrides the hardcoded api.openai.com / api.anthropic.com
#              endpoint -- e.g. a proxy, gateway, or self-hosted endpoint.
#   model      overrides the hardcoded model name for this service only.
# All four are independent and optional -- e.g. set only `model` to try a
# newer model against the same key/endpoint/vendor.
#
# Scope note for whoever picks this up next: this lets each service point
# at a DIFFERENT vendor ACCOUNT/ENDPOINT/MODEL using the two EXISTING
# request shapes (openai chat-completions / anthropic messages). It does
# NOT yet add a genuinely different vendor's request/response shape (e.g. a
# dedicated OCR API like Textract, or a dedicated face-match API like
# Rekognition) -- that would need new methods in VisionProviderService with
# that vendor's own request/response handling, not just a new base-url.
# This is the configuration space to grow that into once a specific vendor
# is chosen; see LiveAnalysisOrchestrator.runProvider() for where the
# actual per-service dispatch happens.
safe.ocr.provider=${SAFE_OCR_PROVIDER:}
safe.ocr.api-key=${SAFE_OCR_API_KEY:}
safe.ocr.base-url=${SAFE_OCR_BASE_URL:}
safe.ocr.model=${SAFE_OCR_MODEL:}

safe.facematch.provider=${SAFE_FACEMATCH_PROVIDER:}
safe.facematch.api-key=${SAFE_FACEMATCH_API_KEY:}
safe.facematch.base-url=${SAFE_FACEMATCH_BASE_URL:}
safe.facematch.model=${SAFE_FACEMATCH_MODEL:}

# ═══════════════════════════════════════════════════════════════════════════
# v70: IDScan hand-off (see IDSCAN_V70_README.md)
# ═══════════════════════════════════════════════════════════════════════════
# The ONLY endpoint the applicant pages call is POST /api/v1/idscan/submit. The
# JAR builds the register payload, forwards it, and runs OCR. Nothing the
# register endpoint or OCR returns is ever sent back to the applicant's browser.
safe.idscan.register-url=${SAFE_IDSCAN_REGISTER_URL:http://localhost:3002/api/id_verification/register}
safe.idscan.check-status-url=${SAFE_IDSCAN_CHECK_STATUS_URL:http://localhost:3002/api/id_verification/check_status}
safe.idscan.timeout-seconds=${SAFE_IDSCAN_TIMEOUT_SECONDS:60}
# The endpoint is currently open. If that changes, set a header name/value here.
safe.idscan.auth-header-name=${SAFE_IDSCAN_AUTH_HEADER_NAME:}
safe.idscan.auth-header-value=${SAFE_IDSCAN_AUTH_HEADER_VALUE:}
# Secret salt for device_digital_signature (salted SHA-256 of stable device
# signals). REQUIRED for real use: set a long random value. If blank the hash is
# unsalted and a warning is logged at startup.
safe.idscan.device-signature-salt=${SAFE_DEVICE_SIG_SALT:}
# false = use the socket address as the client IP (safe default). Set true ONLY
# when this JAR sits behind a trusted reverse proxy/load balancer that overwrites
# X-Forwarded-For; otherwise an applicant could forge their own IP.
safe.idscan.trust-forwarded-for=${SAFE_IDSCAN_TRUST_FORWARDED_FOR:false}
# OCR (Claude by default, see ANTHROPIC_API_KEY / safe.ocr.* above). No face match.
safe.idscan.ocr-enabled=${SAFE_IDSCAN_OCR_ENABLED:true}
# One <reference>.json per submission plus <reference>.ocr.json beside it.
# Images are NEVER written here, only their sizes.
safe.idscan.cases-dir=${SAFE_IDSCAN_CASES_DIR:idscan-cases}

# The original demo API (POST/GET /api/v1/cases, saved reports). Off by default:
# the applicant flow no longer uses it, and it returns analysis results.
safe.demo-endpoints.enabled=${SAFE_DEMO_ENDPOINTS_ENABLED:false}
